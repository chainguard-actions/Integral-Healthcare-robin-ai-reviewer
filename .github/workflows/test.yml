name: Tests

on: [pull_request]

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install bats-core and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats jq

      - name: Run bats tests
        run: bats tests/

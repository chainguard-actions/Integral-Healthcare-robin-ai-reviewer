name: Test basic invocation with fake credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Provide all required inputs with fake values. The action should pass
      # argument parsing and env-var validation, then fail when it tries to
      # call the GitHub API with a fake token. The important thing is that it
      # does NOT fail with "The env variable '...' is required."
      - name: Create fake GitHub event file
        run: |
          mkdir -p /tmp/fake-event
          echo '{"pull_request":{"number":42}}' > /tmp/fake-event/event.json

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-github-token-for-testing
          AI_API_KEY: fake-ai-api-key-for-testing
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini
        env:
          GITHUB_REPOSITORY: fake-owner/fake-repo
          GITHUB_EVENT_PATH: /tmp/fake-event/event.json
          GITHUB_EVENT_NAME: pull_request

      # The action should fail (fake credentials → API error), but it must
      # NOT succeed unexpectedly. We just verify it ran far enough to attempt
      # the GitHub API call (i.e., it passed all validation steps).
      - name: Assert action ran and failed at API call stage
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          fi
          echo "PASS: action correctly failed (expected with fake credentials)"

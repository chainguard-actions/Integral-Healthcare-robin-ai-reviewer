name: Test basic startup with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake pull_request event file
        run: |
          mkdir -p /tmp/fake-event
          cat > /tmp/fake-event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 42,
              "title": "Test PR",
              "body": "Test body"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/fake-event/event.json
        with:
          GITHUB_TOKEN: fake-github-token
          AI_API_KEY: fake-ai-api-key
          AI_PROVIDER: openai
          AI_MODEL: o4-mini

      - name: Assert action failed at API call (not at startup/validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake token causes a GitHub API error,
          # not because of missing env vars or argument parsing issues.
          # Either failure or success is acceptable here — what matters is it didn't
          # crash before reaching the API call stage.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran through startup and validation successfully"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

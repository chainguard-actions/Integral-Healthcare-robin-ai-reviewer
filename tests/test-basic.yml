name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke Robin AI Reviewer with required inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-github-token
          AI_API_KEY: fake-api-key
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini

      - name: Assert action ran (failed due to invalid credentials, not misconfiguration)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because the tokens are fake, not because
          # the action itself is misconfigured or the Docker image failed to build.
          # We accept either 'success' or 'failure' — both mean the action ran.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it did not run at all"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"

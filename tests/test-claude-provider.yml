name: Test claude AI provider with files_to_ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke Robin AI Reviewer with claude provider and files_to_ignore
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-github-token
          AI_API_KEY: fake-claude-api-key
          AI_PROVIDER: claude
          AI_MODEL: claude-3-5-sonnet-20241022
          files_to_ignore: README.md package-lock.json assets/*
          ai_max_tokens: '4096'
          max_diff_bytes: '150000'
          chunk_threshold_bytes: '50000'

      - name: Assert action ran with claude provider
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because the tokens are fake, not because
          # the claude provider or files_to_ignore input is invalid.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it did not run at all"
            exit 1
          fi
          echo "PASS: action ran with claude provider (outcome=$OUTCOME)"

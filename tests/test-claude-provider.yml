name: Test Claude AI provider input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake pull_request event file
        run: |
          mkdir -p /tmp/fake-event
          cat > /tmp/fake-event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 7,
              "title": "Claude test PR",
              "body": "Testing Claude provider"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/fake-event/event.json
        with:
          GITHUB_TOKEN: fake-github-token
          AI_API_KEY: fake-claude-api-key
          AI_PROVIDER: claude
          AI_MODEL: claude-3-7-sonnet-20250219

      - name: Assert action ran with Claude provider (fails at API, not at startup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake token causes a GitHub API error,
          # not because of argument parsing or provider validation issues.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action accepted claude provider and ran through validation"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

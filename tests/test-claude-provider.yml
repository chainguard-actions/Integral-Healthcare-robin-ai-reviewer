name: Test claude AI provider configuration
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts AI_PROVIDER=claude and a claude model.
      # Under workflow_dispatch there is no PR, so the action will fail when
      # it tries to fetch the PR diff — but it must get past the initial
      # validation (provider/model/token checks) first.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          AI_API_KEY: sk-ant-placeholder-not-a-real-key
          AI_PROVIDER: claude
          AI_MODEL: claude-3-5-haiku-20241022
          review_mode: comment

      - name: Assert action failed at PR lookup not at provider validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no PR context), but NOT because of an
          # unsupported provider — it should reach the GitHub API step.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action accepted claude provider and failed at PR lookup as expected"

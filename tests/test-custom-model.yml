name: Test custom gpt_model_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          OPEN_AI_API_KEY: fake-openai-key-for-model-test
          gpt_model_name: gpt-3.5-turbo
          github_api_url: https://api.github.com

      - name: Assert action ran with custom model input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed (empty diff) or fail (API errors)
          # but NOT be 'skipped' — it must have actually run.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, it did not run at all"
            exit 1
          fi
          echo "PASS: action ran with gpt-3.5-turbo model (outcome=$OUTCOME)"

name: Test deprecated gpt_model_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test deprecated gpt_model_name input is accepted
        id: action
        continue-on-error: true
        uses: .
        with:
          GITHUB_TOKEN: ${{ github.token }}
          AI_API_KEY: fake-key-for-input-coverage
          AI_PROVIDER: openai
          gpt_model_name: gpt-3.5-turbo
          review_mode: comment
      - name: Assert action accepted the deprecated input without argument error
        run: |
          # The action is expected to fail because there is no real PR context
          # or valid API key, but it must NOT fail due to an unrecognized input.
          # The outcome will be 'failure' (Docker exits non-zero due to missing PR),
          # but that is acceptable — we only verify the input was accepted.
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: gpt_model_name input was accepted by the action definition"

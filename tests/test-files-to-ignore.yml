name: Test files_to_ignore input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with files_to_ignore but no API key (expect failure on missing key)
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          AI_PROVIDER: openai
          AI_API_KEY: ''
          files_to_ignore: 'README.md assets/* package-lock.json'

      - name: Assert action failed due to missing API key
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when AI_API_KEY is empty"
            exit 1
          fi
          echo "PASS: action correctly failed with files_to_ignore set when AI_API_KEY was not provided"

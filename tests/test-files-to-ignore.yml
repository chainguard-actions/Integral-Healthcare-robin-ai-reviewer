name: Test files_to_ignore input is accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts a files_to_ignore list without crashing
      # during argument parsing. The action will fail at the GitHub API step
      # (no PR context under workflow_dispatch), but it must reach that point —
      # meaning files_to_ignore was parsed and accepted correctly.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          AI_API_KEY: sk-placeholder-not-a-real-key
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini
          files_to_ignore: "README.md assets/* package-lock.json"
          review_mode: comment

      - name: Assert action failed at PR lookup not at argument parsing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no PR context), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action accepted files_to_ignore and failed at PR lookup as expected"

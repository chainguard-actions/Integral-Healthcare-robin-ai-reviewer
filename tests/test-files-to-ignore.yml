name: Test files_to_ignore optional input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake GitHub event file simulating a pull_request event
      - name: Create fake GitHub event file
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 99
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV

      # Run the action with files_to_ignore set to multiple files.
      # The action should start, pass env var validation, and fail at the GitHub API call
      # (expected with fake credentials). This verifies the optional input is accepted.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: test-owner/test-repo
          GITHUB_EVENT_PATH: /tmp/github-event/event.json
        with:
          GITHUB_TOKEN: fake-token-for-testing
          OPEN_AI_API_KEY: fake-openai-key-for-testing
          gpt_model_name: gpt-4-turbo
          github_api_url: https://api.github.com
          files_to_ignore: "*.lock package-lock.json yarn.lock"

      - name: Assert action ran with files_to_ignore input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail at the API stage (fake credentials), not at startup
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with files_to_ignore and failed at API stage as expected"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully with files_to_ignore"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

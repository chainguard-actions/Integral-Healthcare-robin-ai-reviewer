name: Test legacy gpt_model_name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify gpt_model_name input is accepted
        id: action
        continue-on-error: true
        uses: .
        with:
          GITHUB_TOKEN: fake-github-token
          AI_API_KEY: fake-ai-api-key
          AI_PROVIDER: openai
          gpt_model_name: gpt-4
          review_mode: comment
      - name: Assert action was invoked with legacy gpt_model_name input
        run: |
          echo "Action completed (with or without error — legacy input accepted)"
          echo "PASS: gpt_model_name input was passed to the action"

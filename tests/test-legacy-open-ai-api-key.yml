name: Test legacy OPEN_AI_API_KEY input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify OPEN_AI_API_KEY input is accepted
        id: action
        continue-on-error: true
        uses: .
        with:
          GITHUB_TOKEN: fake-github-token
          OPEN_AI_API_KEY: fake-legacy-openai-key
          AI_API_KEY: fake-ai-api-key
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini
          review_mode: comment
      - name: Assert action was invoked with legacy input
        run: |
          echo "Action completed (with or without error — legacy input accepted)"
          echo "PASS: OPEN_AI_API_KEY input was passed to the action"

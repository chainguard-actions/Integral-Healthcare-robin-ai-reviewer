name: Test missing AI API key error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires AI_API_KEY; omitting it should cause the action to
      # exit non-zero with a clear error message about the missing variable.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-github-token
          # AI_API_KEY intentionally omitted to trigger validation error
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini
        env:
          GITHUB_REPOSITORY: fake-owner/fake-repo
          GITHUB_EVENT_PATH: /dev/null
          GITHUB_EVENT_NAME: pull_request

      - name: Assert action failed due to missing AI_API_KEY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when AI_API_KEY is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when AI_API_KEY was missing"

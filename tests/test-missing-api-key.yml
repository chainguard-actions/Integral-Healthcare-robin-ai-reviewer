name: Test missing AI_API_KEY fails with error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires AI_API_KEY (mapped to AI_API_KEY_INPUT env var).
      # When it is absent, utils::verify_required_env_vars should call
      # utils::log_error and exit 1 before ever reaching the GitHub API.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # AI_API_KEY intentionally omitted to trigger the validation error
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini

      - name: Assert action failed due to missing AI_API_KEY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when AI_API_KEY is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when AI_API_KEY was not provided"

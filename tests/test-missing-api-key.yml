name: Test missing AI_API_KEY fails with clear error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action without AI_API_KEY — it should fail with a clear error
      # about the missing required variable.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          AI_API_KEY: ''
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini

      - name: Assert action failed due to missing AI_API_KEY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when AI_API_KEY is empty, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when AI_API_KEY was not provided"

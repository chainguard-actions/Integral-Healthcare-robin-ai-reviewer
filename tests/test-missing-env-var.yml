name: Test missing required env var
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      # Intentionally NOT setting GITHUB_REPOSITORY to trigger validation error
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake event file
        run: |
          mkdir -p /tmp/fake-event
          cat > /tmp/fake-event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 42
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ""
          GITHUB_EVENT_PATH: /tmp/fake-event/event.json
        with:
          GITHUB_TOKEN: fake-token
          AI_API_KEY: fake-api-key
          AI_PROVIDER: openai
          AI_MODEL: o4-mini

      - name: Assert action failed due to missing GITHUB_REPOSITORY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_REPOSITORY is not set"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_REPOSITORY was missing"

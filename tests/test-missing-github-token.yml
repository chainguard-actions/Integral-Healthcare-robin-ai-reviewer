name: Test missing GitHub token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires GITHUB_TOKEN; omitting it should cause the action
      # to exit non-zero with a clear error about the missing variable.
      - id: action
        uses: .
        continue-on-error: true
        with:
          # GITHUB_TOKEN intentionally omitted to trigger validation error
          AI_API_KEY: fake-api-key-for-testing
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini
        env:
          GITHUB_REPOSITORY: fake-owner/fake-repo
          GITHUB_EVENT_PATH: /dev/null
          GITHUB_EVENT_NAME: pull_request

      - name: Assert action failed due to missing GITHUB_TOKEN
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_TOKEN is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_TOKEN was missing"

name: Test missing required env var
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action WITHOUT GITHUB_REPOSITORY set (override it to empty).
      # The action's verify_required_env_vars should detect this and exit with an error.
      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ""
          GITHUB_EVENT_PATH: /nonexistent/path/event.json
        with:
          GITHUB_TOKEN: fake-token-for-testing
          OPEN_AI_API_KEY: fake-openai-key-for-testing
          gpt_model_name: gpt-4-turbo
          github_api_url: https://api.github.com

      - name: Assert action failed due to missing env var
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when GITHUB_REPOSITORY is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required env var was missing"

name: Test action fails gracefully with no PR context
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under workflow_dispatch there is no pull_request in the event payload,
      # so GITHUB_EVENT_PATH will not contain a pull_request.number.
      # The action should fail when it tries to fetch the diff for PR "null".
      # We provide a real GITHUB_TOKEN and a placeholder AI_API_KEY so the
      # action gets past the initial env-var validation and reaches the GitHub
      # API call, which will fail because there is no real PR.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          AI_API_KEY: sk-placeholder-not-a-real-key
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini
          review_mode: comment

      - name: Assert action failed due to missing PR context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when there is no PR in the event context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no PR context was present"

name: Test review mode (inline comments)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke Robin AI Reviewer with review mode (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: fake-github-token
          AI_PROVIDER: openai
          AI_API_KEY: fake-openai-api-key
          AI_MODEL: gpt-4o-mini
          review_mode: review
          ai_max_tokens: '4096'
          max_diff_bytes: '100000'

      - name: Assert action ran (exited with error due to invalid credentials, not a startup crash)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should fail due to invalid credentials/API errors,
          # not due to a missing binary or misconfiguration.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran and produced an outcome (outcome=${{ steps.action.outcome }})"

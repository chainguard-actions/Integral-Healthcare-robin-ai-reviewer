name: Test review_mode=review input is accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that review_mode=review is accepted without crashing during
      # setup. The action will fail at the GitHub API call (no PR under
      # workflow_dispatch), but it must NOT fail during argument parsing
      # or review_mode validation.
      - id: action
        uses: .
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ github.token }}
          AI_API_KEY: fake-key-for-testing
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini
          review_mode: review

      - name: Assert action failed at GitHub API (not at review_mode validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with no PR context"
            exit 1
          fi
          echo "PASS: action with review_mode=review failed as expected (no PR context)"
